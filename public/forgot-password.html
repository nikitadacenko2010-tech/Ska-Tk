<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Забули пароль | Ska-Tka</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="header">
  <div class="header-container">
    <div class="header-left"><a href="index.html" class="logo">Ska-Tka</a></div>
  </div>
</header>
<main class="container" style="max-width:520px;padding:80px 20px;">
  <div style="background:#fff;padding:40px;border-radius:18px;border:1px solid #e4ecf4;box-shadow:0 10px 30px rgba(0,102,204,0.08);">
    <h1 style="font-size:26px;font-weight:900;color:#0d2137;margin-bottom:10px;">Забули пароль?</h1>
    <p style="color:#64748b;font-size:14px;font-weight:700;margin-bottom:25px;">Введіть email, на який зареєстрований акаунт. Ми надішлемо посилання для зміни паролю.</p>
    <div class="form-field"><label>Email</label><input type="email" id="fpEmail" placeholder="you@example.com"></div>
    <button class="action-btn" onclick="sendReset()">Надіслати посилання</button>
    <p style="text-align:center;margin-top:18px;font-size:13px;font-weight:700;color:#64748b;">
      <a href="index.html" style="color:#0066cc;text-decoration:none;">← Повернутися на головну</a>
    </p>
    <div id="fpMsg" style="margin-top:14px;font-weight:800;text-align:center;font-size:14px;"></div>
  </div>
</main>
<script>
async function sendReset() {
  const email = document.getElementById('fpEmail').value.trim();
  const msg = document.getElementById('fpMsg');
  msg.style.color = '#ef4444';
  if (!email) { msg.textContent = 'Вкажіть email'; return; }
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'помилка');
    msg.style.color = '#059669';
    msg.textContent = 'Якщо такий email існує — лист надіслано. Перевірте пошту та папку «Спам».';
  } catch (e) { msg.textContent = e.message; }
}
</script>
</body>
</html>
