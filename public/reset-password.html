<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новий пароль | Ska-Tka</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="header">
  <div class="header-container">
    <div class="header-left"><a href="index.html" class="logo">Ska-Tka</a></div>
  </div>
</header>
<main class="container" style="max-width:520px;padding:80px 20px;">
  <div style="background:#fff;padding:40px;border-radius:18px;border:1px solid #e4ecf4;box-shadow:0 10px 30px rgba(0,102,204,0.08);">
    <h1 style="font-size:26px;font-weight:900;color:#0d2137;margin-bottom:10px;">Новий пароль</h1>
    <p style="color:#64748b;font-size:14px;font-weight:700;margin-bottom:25px;">Введіть новий пароль для свого акаунта.</p>
    <div class="form-field"><label>Новий пароль</label><input type="password" id="rpPass" placeholder="мінімум 6 символів"></div>
    <div class="form-field"><label>Повторіть пароль</label><input type="password" id="rpPass2" placeholder="ще раз"></div>
    <button class="action-btn" onclick="doReset()">Змінити пароль</button>
    <p style="text-align:center;margin-top:18px;font-size:13px;font-weight:700;color:#64748b;">
      <a href="index.html" style="color:#0066cc;text-decoration:none;">← На головну</a>
    </p>
    <div id="rpMsg" style="margin-top:14px;font-weight:800;text-align:center;font-size:14px;"></div>
  </div>
</main>
<script>
async function doReset() {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const p1 = document.getElementById('rpPass').value;
  const p2 = document.getElementById('rpPass2').value;
  const msg = document.getElementById('rpMsg');
  msg.style.color = '#ef4444';

  if (!token) { msg.textContent = 'Посилання недійсне'; return; }
  if (p1.length < 6) { msg.textContent = 'Пароль мінімум 6 символів'; return; }
  if (p1 !== p2) { msg.textContent = 'Паролі не співпадають'; return; }

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: p1 })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'помилка');
    msg.style.color = '#059669';
    msg.textContent = 'Пароль змінено. Перенаправляємо на вхід...';
    setTimeout(() => location.href = 'index.html', 1500);
  } catch (e) { msg.textContent = e.message; }
}
</script>
</body>
</html>
